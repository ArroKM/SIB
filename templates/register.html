<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - {{ app_name }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
                }
            }
        }
    </script>
    <style>
        body { background: #0f172a; }
        .auth-bg {
            background:
                radial-gradient(ellipse at 30% 20%, rgba(59, 130, 246, 0.2) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 80%, rgba(139, 92, 246, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(6, 182, 212, 0.1) 0%, transparent 70%);
        }
    </style>
</head>
<body class="auth-bg min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <!-- Logo & Title -->
        <div class="text-center mb-8 animate-slideUp">
            <div class="logo-icon mx-auto mb-4" style="width:72px;height:72px;">
                <i class="fas fa-user-plus text-3xl"></i>
            </div>
            <h1 class="text-3xl font-bold text-white mb-2">IPIMS</h1>
            <p class="text-gray-400 text-sm">Buat Akun Baru</p>
        </div>

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <div class="mb-6 space-y-3">
            {% for cat, msg in messages %}
            <div class="alert alert-{{ cat }}">
                <i class="fas {{ 'fa-check-circle' if cat == 'success' else 'fa-exclamation-circle' if cat == 'danger' else 'fa-exclamation-triangle' if cat == 'warning' else 'fa-info-circle' }}"></i>
                {{ msg }}
            </div>
            {% endfor %}
        </div>
        {% endif %}
        {% endwith %}

        <!-- Register Card -->
        <div class="card animate-slideUp" style="animation-delay: 0.1s;">
            <div class="card-header">
                <h2 class="text-xl font-bold">Registrasi Akun</h2>
                <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-emerald-500/20 to-cyan-500/20 flex items-center justify-center">
                    <i class="fas fa-user-plus text-emerald-400"></i>
                </div>
            </div>

            <form method="POST" class="space-y-5">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="form-group">
                    <label class="form-label">
                        <i class="fas fa-id-card mr-2 text-emerald-400"></i>Nama Lengkap
                    </label>
                    <input type="text" name="nama_lengkap" required
                           class="form-input"
                           placeholder="Masukkan nama lengkap">
                </div>

                <div class="form-group">
                    <label class="form-label">
                        <i class="fas fa-user mr-2 text-blue-400"></i>Username
                    </label>
                    <input type="text" name="username" required
                           class="form-input"
                           placeholder="Masukkan username">
                </div>

                <div class="form-group">
                    <label class="form-label">
                        <i class="fas fa-lock mr-2 text-violet-400"></i>Password
                    </label>
                    <input type="password" name="password" required minlength="6"
                           class="form-input"
                           placeholder="Minimal 6 karakter">
                </div>

                <div class="form-group">
                    <label class="form-label">
                        <i class="fas fa-building mr-2 text-amber-400"></i>Divisi
                    </label>
                    <select name="divisi" class="form-select">
                        <option value="PEMELIHARAAN">PEMELIHARAAN</option>
                        <option value="OPERASI">OPERASI</option>
                        <option value="TEKNIK">TEKNIK</option>
                        <option value="UMUM">UMUM</option>
                        <option value="ADMINISTRASI">ADMINISTRASI</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary w-full py-3 mt-4">
                    <i class="fas fa-user-plus mr-2"></i>
                    Daftar
                </button>
            </form>

            <div class="auth-footer">
                <p class="text-gray-400">
                    Sudah punya akun?
                    <a href="{{ url_for('auth.login') }}" class="text-blue-400 hover:text-blue-300 font-semibold ml-1">
                        Masuk Sekarang
                    </a>
                </p>
            </div>
        </div>

        <!-- Company Info -->
        <div class="text-center mt-8">
            <p class="text-gray-500 text-sm">
                &copy; {{ now.year }} {{ company_name }}
            </p>
        </div>
    </div>
</body>
</html>
